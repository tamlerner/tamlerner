<g clip-path="url(#clip)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif"><rect width="1200" height="170" fill="#111313"/><text x="56" y="78" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#F5F6F7">Product</text><text x="56" y="108" font-size="15.5" fill="#A3A8B0">Roadmaps, specs, shipping</text><rect x="310" y="52" width="1" height="66" fill="rgba(255,255,255,0.08)"/><text x="338" y="78" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#F5F6F7">Frontend</text><text x="338" y="108" font-size="15.5" fill="#A3A8B0">Design systems, React, Next.js</text><rect x="592" y="52" width="1" height="66" fill="rgba(255,255,255,0.08)"/><text x="620" y="78" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#F5F6F7">Automation</text><text x="620" y="108" font-size="15.5" fill="#A3A8B0">n8n, APIs, AI agents</text><rect x="874" y="52" width="1" height="66" fill="rgba(255,255,255,0.08)"/><text x="902" y="78" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#F5F6F7">Finance</text><text x="902" y="108" font-size="15.5" fill="#A3A8B0">Controls, reconciliation, data</text></g>
